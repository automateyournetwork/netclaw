# NetClaw log forwarding to OTel Collector (VictoriaLogs/Loki) on 192.168.13.202:1514
# Install: sudo cp scripts/rsyslog-netclaw-forward.conf /etc/rsyslog.d/60-netclaw.conf
#          sudo systemctl restart rsyslog
#
# Log sources:
#   mesh daemon        -> flat file /tmp/bgp-daemon-v2.log   (imfile)
#   OpenClaw gateway   -> journald (systemd service)          (imjournal, programname match)
#   alert receiver     -> flat file (created when it runs)     (imfile)

module(load="imfile" mode="inotify")

# --- netclaw-mesh (BGP / federation / N2N / iN2N / NCFED / certs) ---
input(type="imfile"
      File="/tmp/bgp-daemon-v2.log"
      Tag="netclaw-mesh"
      Severity="info"
      Facility="local0"
      reopenOnTruncate="on"
      freshStartTail="off")

# --- netclaw-alerts (alert receiver, if/when it writes a flat log) ---
input(type="imfile"
      File="/tmp/netclaw-alert-receiver.log"
      Tag="netclaw-alerts"
      Severity="info"
      Facility="local0"
      reopenOnTruncate="on"
      freshStartTail="off")

# Forward all local0 (the imfile inputs above) to the OBS stack over UDP.
local0.* @192.168.13.202:1514

# --- netclaw-gateway (OpenClaw runs as a systemd service -> journald) ---
# imuxsock already ingests journal-forwarded messages; match the openclaw unit
# by program name and forward those too.
if $programname startswith 'openclaw' then {
    action(type="omfwd"
           target="192.168.13.202"
           port="1514"
           protocol="udp"
           template="RSYSLOG_SyslogProtocol23Format")
}
