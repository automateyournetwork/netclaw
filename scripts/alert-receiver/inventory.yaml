# Local device inventory — fallback when Nautobot is unavailable.
# Maps hostnames/instance labels to device metadata for alert enrichment.
#
# The alert receiver tries Nautobot first; if the device isn't found there,
# it checks this file. This lets you monitor devices that aren't (yet) in
# your SoT.

devices:
  # pfSense firewall
  pfsense:
    ip: "192.168.3.1"
    platform: pfsense
    role: firewall
    site: home

  # Example: Switches
  HomeSwitch01:
    ip: "192.168.3.2"
    platform: ios
    role: home_switch
    site: home
  
  HomeSwitch02:
    ip: "192.168.3.3"
    platform: ios
    role: home_switch
    site: home

  # OBS VM (monitoring self-monitoring)
  home-obs-stack:
    ip: "192.168.3.250"
    platform: linux
    role: monitoring
    site: home
