# NetClaw agent log forward → Convergence Promtail syslog (greenfield Phase 8)
#
# Install:
#   sudo cp scripts/rsyslog-netclaw-convergence.conf /etc/rsyslog.d/60-netclaw-convergence.conf
#   sudo systemctl restart rsyslog
#
# Requires: deploy/convergence promtail (profile full or device-syslog) listening
# UDP 1514 on this host (SYSLOG_HOST_PORT).
#
# Prefer this over scripts/rsyslog-netclaw-forward.conf when using Convergence
# Loki instead of pilot OBS.

module(load="imfile" mode="inotify")
module(load="imjournal" StateFile="imjournal.state" ignorePreviousMessages="on")

# --- netclaw-mesh (BGP / federation) ---
input(type="imfile"
      File="/tmp/bgp-daemon-v2.log"
      Tag="netclaw-mesh:"
      Severity="info"
      Facility="local0"
      reopenOnTruncate="on"
      freshStartTail="off")

# --- alert-receiver flat log (if configured) ---
input(type="imfile"
      File="/tmp/netclaw-alert-receiver.log"
      Tag="netclaw-alerts:"
      Severity="info"
      Facility="local0"
      reopenOnTruncate="on"
      freshStartTail="off")

# OpenClaw gateway / HUD via journal
if $programname contains "openclaw" or $programname contains "netclaw" then {
  action(type="omfwd"
         Target="127.0.0.1"
         Port="1514"
         Protocol="udp"
         Template="RSYSLOG_SyslogProtocol23Format")
  stop
}

# Forward imfile local0 to Promtail
if $syslogfacility-text == "local0" then {
  action(type="omfwd"
         Target="127.0.0.1"
         Port="1514"
         Protocol="udp"
         Template="RSYSLOG_SyslogProtocol23Format")
  stop
}
