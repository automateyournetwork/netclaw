name: HUD checks

on:
  pull_request:
    paths:
      - 'ui/netclaw-visual/**'
      - 'scripts/install-pyats-genie.py'
      - 'scripts/test-install-pyats-genie.py'
      - 'tests/canvas-terminal/**'
      - 'tests/hermes-hud/**'
      - 'mcp-servers/hermes-hud-mcp/**'
      - 'config/hermes-hud*'
      - 'scripts/*hermes-hud*'
      - 'scripts/runtime-selection.*'
      - 'scripts/hud-launch.mjs'
      - '.github/workflows/hud-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui/netclaw-visual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/netclaw-visual/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canvas terminal contracts, Python mocks and bundle budget
        working-directory: .
        run: bash tests/canvas-terminal/run-tests.sh

      - uses: astral-sh/setup-uv@v6
      - name: Qualified Hermes agent with controlled provider and installed MCP
        working-directory: .
        run: python3 tests/hermes-hud/run_real_fixture.py
