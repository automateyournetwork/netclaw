# IP SLA SNMP metrics — add to otel-config.yaml receivers
#
# These OIDs poll Cisco IP SLA jitter and echo probe results.
# Only needed on PE and CE devices (they run the probes).
#
# Add this metrics block to the snmp/pe1, snmp/pe2, snmp/pe3,
# snmp/ce1, snmp/ce2 receiver definitions.

# --- Paste into each PE/CE snmp receiver's metrics: block ---

      # IP SLA RTT (latest round-trip time in milliseconds)
      ip_sla.rtt:
        unit: ms
        gauge:
          value_type: int
        column_oids:
        - oid: 1.3.6.1.4.1.9.9.42.1.2.10.1.1
          resource_attributes:
          - interface

      # IP SLA Jitter SD (source-to-destination average jitter in ms)
      ip_sla.jitter.sd:
        unit: ms
        gauge:
          value_type: int
        column_oids:
        - oid: 1.3.6.1.4.1.9.9.42.1.5.2.1.63
          resource_attributes:
          - interface

      # IP SLA Jitter DS (destination-to-source average jitter in ms)
      ip_sla.jitter.ds:
        unit: ms
        gauge:
          value_type: int
        column_oids:
        - oid: 1.3.6.1.4.1.9.9.42.1.5.2.1.64
          resource_attributes:
          - interface

      # IP SLA Packet Loss SD (source-to-dest lost packets)
      ip_sla.packet_loss.sd:
        unit: '{packets}'
        sum:
          value_type: int
          aggregation: cumulative
          monotonic: true
        column_oids:
        - oid: 1.3.6.1.4.1.9.9.42.1.5.2.1.26
          resource_attributes:
          - interface

      # IP SLA Packet Loss DS (dest-to-source lost packets)
      ip_sla.packet_loss.ds:
        unit: '{packets}'
        sum:
          value_type: int
          aggregation: cumulative
          monotonic: true
        column_oids:
        - oid: 1.3.6.1.4.1.9.9.42.1.5.2.1.27
          resource_attributes:
          - interface

      # IP SLA Latest Jitter Average (combined avg jitter)
      ip_sla.jitter.avg:
        unit: ms
        gauge:
          value_type: int
        column_oids:
        - oid: 1.3.6.1.4.1.9.9.42.1.5.2.1.46
          resource_attributes:
          - interface

      # IP SLA Completions (successful probe completions)
      ip_sla.completions:
        unit: '{probes}'
        sum:
          value_type: int
          aggregation: cumulative
          monotonic: true
        column_oids:
        - oid: 1.3.6.1.4.1.9.9.42.1.5.2.1.1
          resource_attributes:
          - interface
