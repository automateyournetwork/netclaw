# VictoriaMetrics scrape config
#
# protocol-mcp: legacy injection-demo metrics (not monitoring SoT)
# netclaw-bgp-snmp: Phase 1 router-native BGP metrics (spec 031)

scrape_configs:
  - job_name: "netclaw-bgp-snmp"
    scrape_interval: 60s
    static_configs:
      - targets: ["192.168.220.204:9102"]
        labels:
          service: "netclaw-bgp-snmp"
          component: "bgp-snmp-exporter"

  - job_name: "netclaw-bgp-bmp"
    scrape_interval: 30s
    static_configs:
      - targets: ["192.168.220.206:9100"]
        labels:
          service: "netclaw-bgp-bmp"
          component: "bgp-bmp-consumer"

  - job_name: "netclaw-bgp-gnmi"
    scrape_interval: 30s
    static_configs:
      - targets: ["192.168.220.207:9103"]
        labels:
          service: "netclaw-bgp-gnmi"
          component: "bgp-gnmi-exporter"

  - job_name: "protocol-mcp"
    scrape_interval: 15s
    static_configs:
      - targets: ["192.168.220.1:9179"]
        labels:
          service: "netclaw-protocol-mcp"
          component: "bgp-speaker"