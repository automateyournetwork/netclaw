---
# gNMI BGP state plane overlay (spec 031 Phase 4)
#
# Usage:
#   docker compose -f observability/docker-compose.observability.yml \
#     -f observability/docker-compose.gnmi.yml up -d --build
#
# Streams OpenConfig BGP from remote Arista devices (192.168.220.12–19:6030)
# to the bgp-gnmi-exporter (reached via host routing + published port 9103).

services:
  bgp-gnmi-exporter:
    build:
      context: .
      dockerfile: exporters/Dockerfile.gnmi
    container_name: bgp-gnmi-exporter
    restart: unless-stopped
    environment:
      - BGP_GNMI_EXPORTER_PORT=9103
      - GNMI_SUBSCRIPTIONS=/app/gnmi/subscriptions.yaml
    ports:
      - "9103:9103"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9103/metrics')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - netclaw-obs