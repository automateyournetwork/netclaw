apiVersion: 1
groups:
  - orgId: 1
    name: bgp-stability-evaluation
    folder: Lab Network
    interval: 1m
    rules:
      # ALERT-001: BGP peer not established (CRITICAL)
      - uid: netclaw-bgp-peer-down
        title: netclaw-bgp-peer-down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: netclaw_bgp_peer_state{device_name=~"rr1|pe.*"} != 6
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: BGP peer {{ $labels.neighbor }} down on {{ $labels.device_name }}
          description: Peer session state is not ESTABLISHED (6). Check syslog ADJCHANGE and pyATS show ip bgp summary.
        labels:
          severity: critical
          team: lab-noc
          alert_id: ALERT-001

      # ALERT-002: Prefix count drop (HIGH)
      - uid: netclaw-bgp-prefix-drop
        title: netclaw-bgp-prefix-drop
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: (netclaw_bgp_peer_prefixes_received < 0.8 * avg_over_time(netclaw_bgp_peer_prefixes_received[1h])) and netclaw_bgp_peer_prefixes_received > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: BGP prefix count dropped >20% on {{ $labels.device_name }} peer {{ $labels.neighbor }}
          description: Prefixes received fell below 80% of 1h average. Correlate with interface changes and BMP withdrawals.
        labels:
          severity: high
          team: lab-noc
          alert_id: ALERT-002

      # ALERT-003: Session re-establishment (WARNING)
      - uid: netclaw-bgp-session-flap
        title: netclaw-bgp-session-flap
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: increase(netclaw_bgp_peer_established_transitions_total[15m]) > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: BGP session flap on {{ $labels.device_name }} peer {{ $labels.neighbor }}
          description: Established-state transition counter increased in the last 15m.
        labels:
          severity: warning
          team: lab-noc
          alert_id: ALERT-003

      # ALERT-004: BMP withdrawal rate (HIGH — production; lab when BMP active)
      - uid: netclaw-bgp-prefix-withdrawal-rate
        title: netclaw-bgp-prefix-withdrawal-rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: sum by (device_name, prefix) (rate(netclaw_bgp_prefix_withdrawals_total[5m])) > 0.05
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: BMP withdrawal rate elevated for {{ $labels.prefix }} on {{ $labels.device_name }}
          description: Per-prefix BMP withdrawal rate exceeds 0.05/s. May be idle in lab until BMP peers send updates.
        labels:
          severity: high
          team: lab-noc
          alert_id: ALERT-004

      # ALERT-005: SNMP UPDATE storm (WARNING — lab fallback)
      - uid: netclaw-bgp-update-rate-high
        title: netclaw-bgp-update-rate-high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: rate(netclaw_bgp_peer_in_updates_total[5m]) > 3 * avg_over_time(rate(netclaw_bgp_peer_in_updates_total[5m])[1d:])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: BGP UPDATE rate spike on {{ $labels.device_name }} peer {{ $labels.neighbor }}
          description: Inbound UPDATE rate exceeds 3x the 1d average. Tune multiplier after baselining.
        labels:
          severity: warning
          team: lab-noc
          alert_id: ALERT-005

      # ALERT-006: Path jitter elevated (WARNING)
      - uid: netclaw-path-jitter-high
        title: netclaw-path-jitter-high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: max by (device_name) (netclaw_path_jitter_ms{device_name=~"pe.*|ce.*"}) > 30
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: IP SLA jitter above 30ms on {{ $labels.device_name }}
          description: Path quality degraded — may cause BGP hold-timer expiry if sustained.
        labels:
          severity: warning
          team: lab-noc
          alert_id: ALERT-006

      # ALERT-007: Interface oper change + BGP activity (HIGH)
      - uid: netclaw-interface-bgp-correlation
        title: netclaw-interface-bgp-correlation
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              editorMode: code
              expr: changes(interface_status{device_role=~"pe|p"}[5m]) > 0 and on(device_name) rate(netclaw_bgp_peer_in_updates_total[5m]) > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: Interface change correlated with BGP activity on {{ $labels.device_name }}
          description: Oper-state change within 5m while BGP UPDATE rate is non-zero. Likely link flap root cause.
        labels:
          severity: high
          team: lab-noc
          alert_id: ALERT-007