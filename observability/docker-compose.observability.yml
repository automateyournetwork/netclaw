---
# Observability stack for the Nautobot Workshop lab
# Uses its own Docker network (netclaw-obs). Lab devices at 192.168.220.0/24
# are reached via host IP routing (the lab now lives on a remote VM).
#
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#
# After the lab move:
#   - No dependency on clab-mgmt / 192.168.220.0/24 Docker network.
#   - Inbound telemetry uses published ports on the host.
#   - Outbound (SNMP/gNMI pulls, etc.) uses host routing to the remote lab subnet.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: otel-collector
    restart: unless-stopped
    volumes:
      - ./otel-collector/otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "1514:1514/udp"  # Syslog UDP
    networks:
      - netclaw-obs
    depends_on:
      - victoriametrics
      - loki

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    container_name: victoriametrics
    restart: unless-stopped
    volumes:
      - vm-data:/storage
      - ./victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    command:
      - "--storageDataPath=/storage"
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=30d"
      - "--promscrape.config=/etc/victoriametrics/scrape.yml"
    ports:
      - "8428:8428"
    networks:
      - netclaw-obs

  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - netclaw-obs

  bgp-snmp-exporter:
    build: ./exporters
    container_name: bgp-snmp-exporter
    restart: unless-stopped
    environment:
      - SNMP_COMMUNITY=public
      - BGP_SNMP_POLL_INTERVAL=60
      - BGP_SNMP_EXPORTER_PORT=9102
      - NAUTOBOT_DATASOURCE=/datasource/devices
    volumes:
      - ${NAUTOBOT_DATASOURCE:-/home/ubuntu/github-projects/Nautobot-Workshop-Datasource/config_contexts/devices}:/datasource/devices:ro
    ports:
      - "9102:9102"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/metrics')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - netclaw-obs

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=netclaw
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - OPENCLAW_HOOK_URL=${OPENCLAW_HOOK_URL}
      - OPENCLAW_HOOK_TOKEN=${OPENCLAW_HOOK_TOKEN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - netclaw-obs
    depends_on:
      - victoriametrics
      - loki

volumes:
  vm-data:
  loki-data:
  grafana-data:

networks:
  netclaw-obs:
    driver: bridge
    # Using a non-conflicting subnet so the host can route to the remote
    # lab's 192.168.220.0/24 via its normal routing table (no local Docker
    # bridge claiming the lab management subnet).
    ipam:
      config:
        - subnet: 172.28.220.0/24
