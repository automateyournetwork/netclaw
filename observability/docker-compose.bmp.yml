---
# BMP event plane overlay (spec 031 Phase 3)
#
# Usage:
#   docker compose -f observability/docker-compose.observability.yml \
#     -f observability/docker-compose.bmp.yml up -d --build
#
# BMP peers (remote lab) connect to the host's published port for gobmp:5000
# (the observability services now live on netclaw-obs Docker network; lab
# devices reach this host via routing).

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --overprovisioned
      - --mode
      - dev-container
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
      - --set
      - redpanda.auto_create_topics_enabled=true
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - netclaw-obs

  gobmp:
    image: sbezverk/gobmp:latest
    container_name: gobmp
    restart: unless-stopped
    command:
      - "--source-port=5000"
      - "--kafka-server=redpanda:9092"
      - "--split-af=true"
      - "--kafka-topic-retention-time-ms=900000"
      - "--admin-id=netclaw-lab"
      - "--v=3"
    ports:
      - "5000:5000"
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/gobmp", "--help"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - netclaw-obs

  bgp-bmp-consumer:
    build:
      context: ./exporters
      dockerfile: Dockerfile.bmp
    container_name: bgp-bmp-consumer
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP=redpanda:9092
      - KAFKA_TOPIC_PREFIX=
      - BMP_CONSUMER_GROUP=netclaw-bgp-normalizer
      - BMP_EXPORTER_PORT=9100
      - BMP_ROUTER_IP_MAP=192.168.220.11=rr1,100.0.254.5=rr1,2001:db8:100:254::5=rr1,192.168.220.6=pe1,192.168.220.7=pe2,192.168.220.8=pe3
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - netclaw-obs