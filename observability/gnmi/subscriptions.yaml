# OpenConfig BGP subscriptions for Arista cEOS (spec 031 Phase 4)
# Consumed by observability/exporters/bgp_gnmi_exporter.py

defaults:
  port: 6030
  username: admin
  password: admin
  encoding: json
  insecure: true
  tls_skip_verify: true
  sample_interval_ns: 30000000000  # 30s
  network_instance: default

subscriptions:
  - path: network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/session-state
    mode: sample
    metric: netclaw_bgp_peer_state
  - path: network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/peer-as
    mode: sample
    metric: netclaw_bgp_peer_peer_as
  - path: network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/afi-safis/afi-safi/state/prefixes/received
    mode: sample
    metric: netclaw_bgp_peer_prefixes_received

targets:
  - device_name: west-spine01
    host: 192.168.220.12
    vendor: arista
  - device_name: west-spine02
    host: 192.168.220.13
    vendor: arista
  - device_name: west-leaf01
    host: 192.168.220.14
    vendor: arista
  - device_name: west-leaf02
    host: 192.168.220.15
    vendor: arista
  - device_name: east-spine01
    host: 192.168.220.16
    vendor: arista
  - device_name: east-spine02
    host: 192.168.220.17
    vendor: arista
  - device_name: east-leaf01
    host: 192.168.220.18
    vendor: arista
  - device_name: east-leaf02
    host: 192.168.220.19
    vendor: arista