# NetClaw Convergence — example adapter / deploy config (067 Phase 5)
# Copy to ~/.openclaw/convergence.yaml or config/convergence.yaml and edit.
# Secrets stay in ~/.openclaw/.env (and deploy/convergence/.env for Docker) — never commit them.

site: home
deploy: docker   # docker | k3s | none

firewall:
  type: pfsense   # none | pfsense | generic-snmp
  # env (optional MCP): PFSENSE_*
  mgmt_url: https://192.168.13.1:440   # → PFSENSE_MGMT_URL / EDGE_MGMT_URL

wireless:
  type: unifi     # none | unifi | generic-snmp
  unifi:
    host: https://192.168.100.10:11443
    site: default
    # env: UNIFI_API_KEY (required when type=unifi)
    mgmt_url: https://192.168.100.10:11443   # → UNIFI_MGMT_URL
  # Second wireless vendor path (T071) — SNMP-only APs/controllers
  # (Omada, Aruba Instant On, MikroTik, ...). See:
  #   deploy/convergence/adapters/generic-snmp-wireless/README.md
  # generic_snmp:
  #   target: 192.168.1.20
  #   community: public   # → SNMP_WIRELESS_COMMUNITY (compose profile: generic-snmp-wireless)

sot:
  type: none      # none | nautobot | netbox
  # env: NAUTOBOT_URL / NAUTOBOT_TOKEN  or  NETBOX_URL / NETBOX_TOKEN

metrics:
  # After Docker: http://127.0.0.1:9090
  # After K3s (port-forward / NodePort): http://127.0.0.1:9090 or :30080 API
  prometheus_url: http://127.0.0.1:9090
  # optional (compose --profile full):
  # loki_url: http://127.0.0.1:3100
  # victoriametrics_url: http://127.0.0.1:8428

# Phase 8 greenfield — campus switches (NOT wireless generic-snmp)
# Compose: --profile device-snmp   · community in adapters/device-snmp/snmp.yml
device_telemetry:
  snmp:
    enabled: false
    engine: snmp_exporter
    version: v2c
    poll_interval: 60s
    targets:
      - name: HomeSwitch01
        ip: 192.168.3.2
        role: switch
      - name: HomeSwitch02
        ip: 192.168.3.3
        role: switch
      - name: HomeSwitch04
        ip: 192.168.3.5
        role: switch
  syslog:
    enabled: false
    listen: "0.0.0.0:1514"

# Phase 8 — NetClaw host metrics/logs (optional)
agent_observability:
  token_exporter:
    enabled: false   # systemctl --user enable --now openclaw-token-exporter
    port: 9110
  log_forward:
    enabled: false   # rsyslog → Convergence Loki when full profile is up

grafana:
  provision_network_dashboards: true
  provision_agent_dashboards: true

home_api:
  # Prefer CONVERGENCE_API_URL — Docker :3080; K3s NodePort :30080
  url: http://127.0.0.1:3080
  # env: CONVERGENCE_API_TOKEN (or HOME_API_TOKEN)

agent:
  alert_receiver_url: http://127.0.0.1:8099/webhook
  # investigator_member: auto resolves guardian-claw (or network-guardian profile)
  investigator_member: auto
  discord_enabled: true

thresholds:
  latency:
    green: 40
    yellow: 80
  loss:
    green: 0
    yellow: 5
  txRetries:
    green: 20
    yellow: 35
