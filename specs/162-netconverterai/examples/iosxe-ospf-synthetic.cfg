hostname spec162-iosxe-ospf
!
ip cef
!
interface Loopback0
 description SYNTHETIC_OSPF_ROUTER_ID
 ip address 192.0.2.1 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet1
 description SYNTHETIC_ISOLATED_OSPF_PEER
 ip address 198.51.100.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf 1 area 0
 no shutdown
!
router ospf 1
 router-id 192.0.2.1
 log-adjacency-changes
 passive-interface default
 no passive-interface GigabitEthernet1
!
end
