---
apiVersion: v1
kind: Service
metadata:
  name: guardian-postgres
  namespace: observability
  labels:
    app: guardian-postgres
spec:
  selector:
    app: guardian-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: guardian-postgres
  namespace: observability
  labels:
    app: guardian-postgres
spec:
  serviceName: guardian-postgres
  replicas: 1
  selector:
    matchLabels:
      app: guardian-postgres
  template:
    metadata:
      labels:
        app: guardian-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: guardian
            - name: POSTGRES_USER
              value: guardian
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guardian-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "guardian"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "guardian"]
            initialDelaySeconds: 15
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
