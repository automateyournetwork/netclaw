@version: 4.8
@include "scl.conf"

#
# Convergence syslog gateway (Phase 10 / T141)
#
# WHY THIS EXISTS
#   Promtail's `syslog` scrape target only parses IETF syslog (RFC5424).
#   Cisco IOS-XE and pfSense emit BSD syslog (RFC3164) by default, which
#   promtail rejects wholesale:
#       "error parsing syslog stream: expecting a version value in the range 1-999"
#   Requiring every customer switch to be reconfigured for RFC5424 is not an
#   acceptable product default (spec FR-035), so this gateway accepts
#   vendor-default syslog and re-emits RFC5424 to promtail.
#
# FLOW
#   devices --RFC3164--> :1514 udp/tcp (this) --RFC5424 octet-framed--> promtail:1601 --> Loki
#
# Ports 1514 udp+tcp are the operator-facing destination and are unchanged from
# the previous promtail-direct setup, so device config / generated checklists
# stay valid.
#

options {
    # Trust the hostname in the message when the device sends one
    # (Cisco: `logging origin-id hostname`). When absent, syslog-ng falls back
    # to the sending IP, which keeps `device_name` populated either way.
    keep-hostname(yes);
    chain-hostnames(no);
    use-dns(no);
    use-fqdn(no);
    # Stamp messages with gateway receive time, NOT the device's own timestamp.
    #
    # RFC3164 timestamps carry no timezone and no year. Trusting them makes every
    # log line land at the device's local wall-clock offset — observed live:
    # pfSense lines arrived stamped ~6h in the past, which puts them outside every
    # "last 15m" dashboard window even though ingest is healthy. Device clock drift
    # compounds it. Receive time is unambiguous and monotonic.
    #
    # Operators with NTP-synced devices emitting RFC5424 (real offsets) can set
    # keep-timestamp(yes) to preserve device time.
    keep-timestamp(no);
    flush-lines(1);
    create-dirs(no);
    stats(freq(0));
};

# --- Ingest: vendor-default syslog from network devices -----------------------
# Default parsing is RFC3164/BSD, which is what Cisco IOS-XE and pfSense send.
source s_devices {
    network(
        transport("udp")
        ip(0.0.0.0)
        port(1514)
        so-rcvbuf(4194304)
    );
    network(
        transport("tcp")
        ip(0.0.0.0)
        port(1514)
        max-connections(64)
    );
};

# --- Egress: RFC5424 to promtail ---------------------------------------------
# The syslog() driver over tcp emits IETF-syslog with octet-counted framing,
# which is exactly what promtail's syslog target expects.
destination d_promtail {
    syslog(
        "promtail"
        transport("tcp")
        port(1601)
        # Survive short promtail restarts without dropping device logs.
        # reliable(no) → size the memory queue in messages (mem-buf-length),
        # not bytes (mem-buf-size, which only applies to reliable buffers).
        disk-buffer(
            mem-buf-length(20000)
            disk-buf-size(52428800)
            reliable(no)
            dir("/config/syslog-buffer")
        )
    );
};

log {
    source(s_devices);
    destination(d_promtail);
};
