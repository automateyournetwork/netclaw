# NetClaw Convergence — Docker minimal stack (067-convergence Phase 3)
#
# Core: postgres, prometheus, alertmanager, blackbox, convergence-api
# Optional: unifi-exporter  →  docker compose --profile unifi up -d
#
# From repo root:
#   cp deploy/convergence/.env.example deploy/convergence/.env   # edit secrets
#   ./deploy/convergence/render-config.sh                 # alertmanager webhook
#   docker compose -f deploy/convergence/docker-compose.yml --env-file deploy/convergence/.env up -d --build
#   ./deploy/convergence/smoke-docker.sh
#
# Point HUD (root ~/.openclaw/.env or repo .env):
#   CONVERGENCE_API_URL=http://127.0.0.1:3080
#   CONVERGENCE_API_TOKEN=<same as API_KEYS[].key in deploy/convergence/.env>

name: netclaw-convergence

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-home}
      POSTGRES_USER: ${PGUSER:-home}
      POSTGRES_PASSWORD: ${PGPASSWORD:-home_dev_change_me}
    volumes:
      - convergence-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-home} -d ${PGDATABASE:-home}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [convergence]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      # Accept remote-write from the Loki ruler, which turns log-derived
      # recording rules (pfsense:filterlog_*, pfsense:dns_*) into ordinary
      # Prometheus series usable by alerts and dashboards (T143).
      # Note: no auth on this endpoint — same posture as the rest of the stack,
      # which is bound to the local Docker network.
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - convergence-promdata:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks: [convergence]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - convergence-amdata:/alertmanager
    ports:
      - "${ALERTMANAGER_HOST_PORT:-9093}:9093"
    extra_hosts:
      # Reach NetClaw host alert-receiver (T031)
      - "host.docker.internal:host-gateway"
    networks: [convergence]

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "${BLACKBOX_HOST_PORT:-9115}:9115"
    networks: [convergence]

  convergence-api:
    build:
      context: ../../ui/convergence-api
      dockerfile: Dockerfile
    image: netclaw-convergence-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      alertmanager:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:3080}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-home}
      PGUSER: ${PGUSER:-home}
      PGPASSWORD: ${PGPASSWORD:-home_dev_change_me}
      PROMETHEUS_URL: http://prometheus:9090
      ALERTMANAGER_URL: http://alertmanager:9093
      # Host alert-receiver for Triage "Need More" → /reinvestigate (strip /webhook if present)
      ALERT_RECEIVER_URL: ${ALERT_RECEIVER_URL:-http://host.docker.internal:8099/webhook}
      JWT_SECRET: ${JWT_SECRET:-change-me-convergence-api-jwt}
      API_KEYS: ${API_KEYS}
      USERS: ${USERS:-[]}
      SITES_CONFIG: ${SITES_CONFIG}
      # Device name → management GUI deep-links (HOME Devices / Wi‑Fi)
      UNIFI_HOST: ${UNIFI_HOST:-}
      UNIFI_MGMT_URL: ${UNIFI_MGMT_URL:-${UNIFI_HOST:-}}
      PFSENSE_MGMT_URL: ${PFSENSE_MGMT_URL:-https://192.168.13.1:440}
      EDGE_MGMT_URL: ${EDGE_MGMT_URL:-${PFSENSE_MGMT_URL:-}}
      # SoT adapter (T070): none | nautobot | netbox
      SOT_TYPE: ${SOT_TYPE:-none}
      NAUTOBOT_URL: ${NAUTOBOT_URL:-}
      NAUTOBOT_TOKEN: ${NAUTOBOT_TOKEN:-}
    ports:
      - "${CONVERGENCE_API_HOST_PORT:-${HOME_API_HOST_PORT:-3080}}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [convergence]

  # Optional UniFi Integration API exporter (profile: unifi)
  unifi-exporter:
    profiles: ["unifi"]
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "/app/exporter.py"]
    environment:
      UNIFI_HOST: ${UNIFI_HOST:-https://192.168.1.1}
      UNIFI_API_KEY: ${UNIFI_API_KEY:-}
      SITE_LABEL: ${SITE_LABEL:-home}
      LISTEN_PORT: "9899"
      GUEST_ACCESS_TYPES: ${GUEST_ACCESS_TYPES:-GUEST,HOTSPOT}
    volumes:
      - ./adapters/unifi/exporter.py:/app/exporter.py:ro
    ports:
      - "${UNIFI_EXPORTER_HOST_PORT:-9899}:9899"
    networks: [convergence]

  # Optional second wireless vendor via generic SNMP (profile: generic-snmp-wireless, T071)
  snmp-wireless-exporter:
    profiles: ["generic-snmp-wireless"]
    image: prom/snmp-exporter:v0.26.0
    restart: unless-stopped
    command: ["--config.file=/etc/snmp_exporter/snmp.yml"]
    volumes:
      - ./adapters/generic-snmp-wireless/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    ports:
      - "${SNMP_WIRELESS_EXPORTER_HOST_PORT:-9116}:9116"
    networks: [convergence]

  # Campus/wired switch SNMP — RETIRED (Phase 11 / T153).
  # snmp_exporter was replaced by the OTel Collector's SNMP receivers, which emit
  # the same metric names with cleaner labels plus interface_admin_status. See
  # deploy/convergence/otel/snmp-receivers.md.

networks:
  convergence:
    name: netclaw-convergence

volumes:
  convergence-pgdata:
  convergence-promdata:
  convergence-amdata:
