# Recording rules: snmp_exporter IF-MIB → pilot-compatible interface_* names.
# Phase 10 (T135): interface_name prefers non-empty ifDescr, else ifName.
#
# Raw scrapes: ifOperStatus / ifHC* / if*Errors with labels ifIndex, ifDescr, ifName
# Recording:   interface_status, interface_octets_*, interface_errors_*
#              + interface_name for dashboards and alert annotations
groups:
  - name: netclaw-convergence.device-recording
    interval: 60s
    rules:
      # Prefer ifDescr when present; fall back to ifName (Cisco short names, empty descr)
      - record: interface_status
        expr: |
          label_replace(
            label_replace(
              ifOperStatus{job="device_snmp"},
              "interface_name", "$1", "ifName", "(.*)"
            ),
            "interface_name", "$1", "ifDescr", "(.+)"
          )

      - record: interface_octets_in_bytes_total
        expr: |
          label_replace(
            label_replace(
              ifHCInOctets{job="device_snmp"},
              "interface_name", "$1", "ifName", "(.*)"
            ),
            "interface_name", "$1", "ifDescr", "(.+)"
          )

      - record: interface_octets_out_bytes_total
        expr: |
          label_replace(
            label_replace(
              ifHCOutOctets{job="device_snmp"},
              "interface_name", "$1", "ifName", "(.*)"
            ),
            "interface_name", "$1", "ifDescr", "(.+)"
          )

      - record: interface_errors_in_total
        expr: |
          label_replace(
            label_replace(
              ifInErrors{job="device_snmp"},
              "interface_name", "$1", "ifName", "(.*)"
            ),
            "interface_name", "$1", "ifDescr", "(.+)"
          )

      - record: interface_errors_out_total
        expr: |
          label_replace(
            label_replace(
              ifOutErrors{job="device_snmp"},
              "interface_name", "$1", "ifName", "(.*)"
            ),
            "interface_name", "$1", "ifDescr", "(.+)"
          )
