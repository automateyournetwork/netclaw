# Phase 8 — campus device SNMP + agent exporter alerts (greenfield)
groups:
  - name: netclaw-convergence.device
    interval: 30s
    rules:
      - alert: DeviceSnmpExporterDown
        expr: up{job="device_snmp"} == 0
        for: 10m
        labels:
          severity: warning
          site: home
        annotations:
          summary: "Device SNMP target not scraping ({{ $labels.device_name }})"
          description: >-
            Prometheus cannot scrape device_snmp for {{ $labels.instance }}.
            Enable compose profile device-snmp, check SNMP community/reachability,
            or remove stale targets from prometheus.yml.

      - alert: SwitchInterfaceDown
        # ifOperStatus 2 = down; ifAdminStatus 1 = up → unexpected operational down
        expr: |
          ifOperStatus{job="device_snmp",role="switch"} == 2
          and on(instance, ifIndex, device_name)
          ifAdminStatus{job="device_snmp",role="switch"} == 1
        for: 5m
        labels:
          severity: warning
          site: home
        annotations:
          summary: "Switch interface down ({{ $labels.device_name }} ifIndex={{ $labels.ifIndex }})"
          description: >-
            Interface admin-up but oper-down on {{ $labels.device_name }}
            ({{ $labels.instance }}). Tune drops for unused ports if noisy.

      - alert: NetclawAgentMetricsDown
        expr: up{job="netclaw-openclaw"} == 0
        for: 15m
        labels:
          severity: info
          site: home
        annotations:
          summary: "NetClaw openclaw-token-exporter not scraping"
          description: >-
            Enable scripts/openclaw-metrics (user systemd) on the NetClaw host
            or ignore if agent_observability.token_exporter is intentionally off.
