# Phase 8 — campus device SNMP + agent exporter alerts (greenfield)
#
# SAFETY (2026-07-25): Do NOT fire per-ifIndex "admin-up oper-down" as a
# pageable/investigated alert. On campus switches that matches every idle
# access port and storms Alertmanager → alert-receiver → OpenClaw hooks
# (one full MCP farm per fingerprint). See docs/CONVERGENCE-ALERT-SAFETY.md.
groups:
  - name: netclaw-convergence.device
    interval: 30s
    rules:
      - alert: DeviceSnmpExporterDown
        expr: up{job="device_snmp"} == 0
        for: 10m
        labels:
          severity: warning
          site: home
          investigate: "true"
        annotations:
          summary: "Device SNMP target not scraping ({{ $labels.device_name }})"
          description: >-
            Prometheus cannot scrape device_snmp for {{ $labels.instance }}.
            Enable compose profile device-snmp, check SNMP community/reachability,
            or remove stale targets from prometheus.yml.

      # Aggregate idle-port inventory for dashboards only — never auto-investigate.
      # Admin-up + oper-down is normal for unused access ports.
      - alert: SwitchIdlePortsPresent
        expr: |
          count by (device_name, instance, site) (
            ifOperStatus{job="device_snmp",role="switch"} == 2
            and on(instance, ifIndex, device_name)
            ifAdminStatus{job="device_snmp",role="switch"} == 1
          ) > 0
        for: 30m
        labels:
          severity: info
          site: home
          investigate: "false"
          cardinality: high
        annotations:
          summary: "Idle admin-up ports on {{ $labels.device_name }} ({{ $value }})"
          description: >-
            {{ $value }} interfaces on {{ $labels.device_name }} are admin-up but
            oper-down. This is expected for unused ports — metrics/dashboard only.
            Not an investigation trigger.

      # Real fault signal: link was UP recently and is now DOWN while admin-up.
      # Idle ports never satisfy the offset==1 clause, so they do not fire.
      - alert: SwitchLinkLost
        expr: |
          (
            ifOperStatus{job="device_snmp",role="switch"} == 2
            and on(instance, ifIndex, device_name)
            ifAdminStatus{job="device_snmp",role="switch"} == 1
          )
          and on(instance, ifIndex, device_name)
          (
            ifOperStatus{job="device_snmp",role="switch"} offset 15m == 1
          )
        for: 3m
        labels:
          severity: warning
          site: home
          investigate: "true"
        annotations:
          summary: >-
            Link lost on {{ $labels.device_name }}
            {{ with $labels.ifDescr }}{{ . }}{{ else }}{{ with $labels.ifName }}{{ . }}{{ else }}ifIndex={{ $labels.ifIndex }}{{ end }}{{ end }}
          description: >-
            Interface was operationally up 15m ago and is now down (admin still up)
            on {{ $labels.device_name }} ({{ $labels.instance }}).
            ifIndex={{ $labels.ifIndex }} ifDescr={{ $labels.ifDescr }} ifName={{ $labels.ifName }}.

      - alert: NetclawAgentMetricsDown
        expr: up{job="netclaw-openclaw"} == 0
        for: 15m
        labels:
          severity: info
          site: home
          investigate: "false"
        annotations:
          summary: "NetClaw openclaw-token-exporter not scraping"
          description: >-
            Enable scripts/openclaw-metrics (user systemd) on the NetClaw host
            or ignore if agent_observability.token_exporter is intentionally off.
