# NetClaw Convergence — minimal Prometheus (067 Phase 3)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # convergence-api liveness via blackbox HTTP (JSON /healthz is not Prometheus textformat)
  - job_name: convergence-api
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://convergence-api:3000/healthz"]
        labels:
          site: home
          service: convergence-api
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # WAN TCP probes via blackbox (public well-known targets)
  - job_name: blackbox_wan_tcp
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 1.1.1.1:443
          - 8.8.8.8:443
          - 9.9.9.9:443
        labels:
          site: home
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        target_label: target
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox_wan_http
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://www.cloudflare.com
          - https://www.google.com
        labels:
          site: home
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # UniFi exporter (compose profile: unifi) — scrape still listed; target down is ok without profile
  - job_name: unifi
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["unifi-exporter:9899"]
        labels:
          site: home

  # Generic SNMP wireless adapter (compose profile: generic-snmp-wireless, T071)
  # Second wireless vendor path for APs without a REST API (Omada, Aruba Instant On, MikroTik, ...).
  # No envsubst on this file — edit the target IP below directly (like blackbox_edge above).
  # Target down is ok without the profile enabled.
  - job_name: generic_snmp_wireless
    scrape_interval: 60s
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [public_v2]
    static_configs:
      - targets:
          - 192.168.1.20   # <-- set to your AP/controller IP
        labels:
          site: home
          role: wireless-generic-snmp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-wireless-exporter:9116

  # Pushgateway for speedtest (full stack overlay, T072 — profile speedtest/full)
  # Target down is ok without the profile enabled.
  - job_name: pushgateway
    scrape_interval: 60s
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          site: home

  # Campus/wired device SNMP (compose profile: device-snmp, Phase 8)
  # Distinct from generic_snmp_wireless (APs). Targets = switch mgmt IPs.
  # Regenerate static_configs via:
  #   python3 scripts/render-device-snmp-scrape.py --targets adapters/device-snmp/targets.example.yml
  # Target down / profile off is ok.
# BEGIN netclaw-convergence-device-snmp
  # Generated by scripts/render-convergence-telemetry.py — Phase 10
  - job_name: device_snmp
    scrape_interval: 60s
    metrics_path: /snmp
    params:
      module: [generic]
      auth: [public_v2]
    static_configs:
      - targets: ["192.168.3.2"]
        labels:
          site: home
          device_name: HomeSwitch01
          role: switch
          vendor: cisco
          snmp_module: cisco
      - targets: ["192.168.3.3"]
        labels:
          site: home
          device_name: HomeSwitch02
          role: switch
          vendor: cisco
          snmp_module: cisco
      - targets: ["192.168.3.5"]
        labels:
          site: home
          device_name: HomeSwitch04
          role: switch
          vendor: cisco
          snmp_module: cisco
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [snmp_module]
        target_label: __param_module
      - target_label: __address__
        replacement: snmp-device-exporter:9116
# END netclaw-convergence-device-snmp
  - job_name: netclaw-openclaw
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9110"]
        labels:
          site: home
          instance: netclaw

  # Promtail — log ship health. Scraped so syslog ingest can never fail
  # silently again (T141 / FR-035): promtail_syslog_target_parsing_errors_total
  # is what caught the RFC3164-vs-RFC5424 drop.
  - job_name: promtail
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["promtail:9080"]
        labels:
          site: home
          instance: promtail

  # Host alert-receiver (investigation pipeline metrics for NetClaw dashboard)
  - job_name: netclaw-alert-receiver
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8099"]
        labels:
          site: home
          instance: alert-receiver

  # Edge firewall (pfSense) HTTPS management UI — override target via file edit or extra job
  - job_name: blackbox_edge
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [http_2xx]  # TLS insecure_skip_verify already set on this module
    static_configs:
      - targets:
          - https://192.168.13.1:440
        labels:
          site: home
          device_name: pfsense
          role: firewall
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
