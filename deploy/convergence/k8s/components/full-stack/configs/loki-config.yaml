# NetClaw Convergence — Loki config (T072 full stack, K3s component)
# Mirrors deploy/convergence/loki/loki-config.yaml (Docker path) and
# k3s-observability-stack/k8s/observability/loki.yml, trimmed for a
# single-replica in-cluster instance (no ingress, no HA ring).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h   # 14d — matches pilot Loki retention
  reject_old_samples: true
  reject_old_samples_max_age: 336h
  allow_structured_metadata: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  compaction_interval: 10m
  delete_request_store: filesystem

# --- Ruler: derive metrics from logs (T143 / T157) ---------------------------
# pfSense exposes no block/DNS counters over SNMP and there is no installable
# pfSense metrics exporter in this repo, so the Security board could only show
# posture, alerts and raw logs (FR-033). The events are already here, parsed into
# structured fields by the OTel Collector, so the ruler derives metrics from them
# and remote-writes to Prometheus — where the existing alerting engine and boards
# can use them like any other series.
#
# Rules are file-managed (GitOps), so the ruler API is off and the rules directory
# is mounted read-only. Single-tenant Loki reads from <dir>/fake/.
ruler:
  enable_api: false
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /tmp/loki-rules
  evaluation_interval: 1m
  ring:
    kvstore:
      store: inmemory
  # The remote-write WAL defaults to a RELATIVE path ("ruler-wal") in the process
  # CWD, which is not writable in this image — the ruler then crash-loops with
  # "create dir: mkdir ruler-wal: permission denied". Pin it to the data volume.
  wal:
    dir: /loki/ruler-wal
  remote_write:
    enabled: true
    clients:
      prometheus:
        url: http://prometheus:9090/api/v1/write
        queue_config:
          capacity: 2500
          max_samples_per_send: 500
