# NetClaw Convergence — Grafana datasource provisioning (T072 full stack, K3s component)
# Mirrors deploy/convergence/grafana/provisioning/datasources/datasources.yml (Docker path).
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: true
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    isDefault: false
    editable: true
  - name: VictoriaMetrics - Long Term
    type: prometheus
    access: proxy
    uid: victoriametrics-longterm
    url: http://victoriametrics:8428
    isDefault: false
    editable: true
