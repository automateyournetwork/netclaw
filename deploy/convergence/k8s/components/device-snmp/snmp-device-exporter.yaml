# snmp_exporter for campus switches (Phase 8). Prometheus scrape job device_snmp
# must list targets (ConfigMap patch or overlay).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-device-exporter
  labels:
    app.kubernetes.io/name: snmp-device-exporter
    app.kubernetes.io/part-of: netclaw-convergence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: snmp-device-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snmp-device-exporter
        app.kubernetes.io/part-of: netclaw-convergence
    spec:
      containers:
        - name: snmp-exporter
          image: prom/snmp-exporter:v0.26.0
          args: ["--config.file=/etc/snmp_exporter/snmp.yml"]
          ports:
            - containerPort: 9116
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/snmp_exporter/snmp.yml
              subPath: snmp.yml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
      volumes:
        - name: config
          configMap:
            name: snmp-device-config
---
apiVersion: v1
kind: Service
metadata:
  name: snmp-device-exporter
  labels:
    app.kubernetes.io/name: snmp-device-exporter
    app.kubernetes.io/part-of: netclaw-convergence
spec:
  selector:
    app.kubernetes.io/name: snmp-device-exporter
  ports:
    - name: http
      port: 9116
      targetPort: http
