# Phase 8/10 — device syslog → Convergence Loki (K3s parity of Docker promtail)
#
# Path: devices --RFC3164--> syslog-ng sidecar hostPort 1514 udp/tcp
#                --RFC5424 octet-framed--> promtail 127.0.0.1:1601 --> Loki
#
# Do NOT point devices at :1601. Promtail's syslog target parses RFC5424 only and
# silently discards BSD/RFC3164 streams — that is exactly the failure this
# component's sidecar exists to prevent (spec FR-035 / T141).
#
# Requires full-stack component (Loki service name: loki) in the same namespace.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: device-syslog
    syslog:
      listen_address: 127.0.0.1:1601
      listen_protocol: tcp
      idle_timeout: 120s
      use_incoming_timestamp: true
      label_structured_data: true
      labels:
        job: device-syslog
        site: home
    relabel_configs:
      - source_labels: [__syslog_message_hostname]
        target_label: host
      - source_labels: [__syslog_message_hostname]
        target_label: device_name
      - source_labels: [__syslog_message_app_name]
        target_label: app
      - source_labels: [__syslog_message_severity]
        target_label: level
      # __syslog_connection_hostname is the sidecar, not the device, so it is
      # deliberately not labelled. Device identity comes from the message
      # hostname, which syslog-ng preserves or fills with the sending IP.
