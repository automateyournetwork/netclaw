@version: 4.8
@include "scl.conf"

#
# Convergence syslog gateway — K3s parity of deploy/convergence/syslog-gateway
# (Phase 10 / T141). Runs as a sidecar next to promtail in the same pod, so the
# hop to promtail is over pod-local loopback.
#
# WHY: promtail's syslog target parses IETF RFC5424 only. Cisco IOS-XE and
# pfSense emit BSD RFC3164 by default and promtail discards those streams
# ("expecting a version value in the range 1-999"). Devices must not have to be
# reconfigured to be observable (spec FR-035).
#
# devices --RFC3164--> hostPort 1514 udp/tcp --RFC5424--> 127.0.0.1:1601 promtail
#

options {
    keep-hostname(yes);
    chain-hostnames(no);
    use-dns(no);
    use-fqdn(no);
    # Gateway receive time, not device time — RFC3164 carries no timezone, so
    # trusting it shifts every line by the device's UTC offset and any clock
    # drift. See the Docker config for the full rationale.
    keep-timestamp(no);
    flush-lines(1);
    create-dirs(no);
    stats(freq(0));
};

source s_devices {
    network(
        transport("udp")
        ip(0.0.0.0)
        port(1514)
        so-rcvbuf(4194304)
    );
    network(
        transport("tcp")
        ip(0.0.0.0)
        port(1514)
        max-connections(64)
    );
};

destination d_promtail {
    syslog(
        "127.0.0.1"
        transport("tcp")
        port(1601)
        disk-buffer(
            mem-buf-length(20000)
            disk-buf-size(52428800)
            reliable(no)
            dir("/var/lib/syslog-ng")
        )
    );
};

log {
    source(s_devices);
    destination(d_promtail);
};
