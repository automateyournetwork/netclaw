# Copy to secret.yaml (gitignored) and fill real values — NEVER commit secret.yaml
#
#   cp deploy/convergence/k8s/secret.example.yaml deploy/convergence/k8s/secret.yaml
#   # edit secret.yaml
#   kubectl apply -f deploy/convergence/k8s/secret.yaml
#
# Generate helpers:
#   openssl rand -base64 32          # JWT_SECRET
#   openssl rand -hex 24             # API key
#   openssl rand -base64 24          # PGPASSWORD
apiVersion: v1
kind: Secret
metadata:
  name: home-secrets
  namespace: netclaw-convergence
  labels:
    app.kubernetes.io/part-of: netclaw-convergence
type: Opaque
stringData:
  PGDATABASE: home
  PGUSER: home
  PGPASSWORD: home_dev_change_me
  JWT_SECRET: change-me-to-a-long-random-string
  # HUD HOME_API_TOKEN must match the "key" field.
  API_KEYS: '[{"id":"hud","name":"HUD","key":"dev-convergence-api-key-change-me","role":"admin","sites":["home"]}]'
  USERS: '[]'
  # Optional — leave empty to keep unifi-exporter down until set
  UNIFI_API_KEY: ""
  # Optional — SoT adapter (T070). Set SOT_TYPE=nautobot in kustomization.yaml
  # configMapGenerator literals, then fill the token here.
  NAUTOBOT_TOKEN: ""
  NETBOX_TOKEN: ""
