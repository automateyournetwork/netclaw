# Blackbox exporter — WAN / edge probes (Docker service: blackbox)
# Service name "blackbox" matches deploy/convergence/prometheus scrape targets.
apiVersion: v1
kind: Service
metadata:
  name: blackbox
  labels:
    app.kubernetes.io/name: blackbox
    app.kubernetes.io/part-of: netclaw-convergence
    app.kubernetes.io/component: probing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blackbox
  ports:
    - name: http
      port: 9115
      targetPort: 9115
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
  labels:
    app.kubernetes.io/name: blackbox
    app.kubernetes.io/part-of: netclaw-convergence
    app.kubernetes.io/component: probing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox
        app.kubernetes.io/part-of: netclaw-convergence
        app.kubernetes.io/component: probing
    spec:
      containers:
        - name: blackbox
          image: prom/blackbox-exporter:v0.25.0
          args:
            - --config.file=/etc/blackbox_exporter/config.yml
          ports:
            - containerPort: 9115
              name: http
          # ICMP module needs NET_RAW; TCP/HTTP probes work without hostNetwork.
          securityContext:
            capabilities:
              add: ["NET_RAW"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox_exporter/config.yml
              subPath: blackbox.yml
          readinessProbe:
            httpGet:
              path: /
              port: 9115
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: blackbox-config
