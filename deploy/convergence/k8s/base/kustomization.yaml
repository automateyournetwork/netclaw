# NetClaw Convergence — Kustomize base (067 Phase 4 / T040)
# Same logical services as deploy/convergence/docker-compose.yml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: netclaw-convergence

labels:
  - pairs:
      app.kubernetes.io/part-of: netclaw-convergence
    includeSelectors: false

resources:
  - namespace.yaml
  - postgres.yaml
  - prometheus.yaml
  - alertmanager.yaml
  - blackbox.yaml
  - convergence-api.yaml
  - unifi-exporter.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=configs/prometheus.yml
  - name: prometheus-alerts
    files:
      - home.rules.yml=configs/home.rules.yml
  - name: alertmanager-config
    files:
      - alertmanager.yml=configs/alertmanager.yml
  - name: blackbox-config
    files:
      - blackbox.yml=configs/blackbox.yml
  - name: convergence-api-config
    literals:
      - PUBLIC_URL=http://127.0.0.1:30080
      - UNIFI_HOST=https://192.168.100.10:11443
      - UNIFI_MGMT_URL=https://192.168.100.10:11443
      - PFSENSE_MGMT_URL=https://192.168.13.1:440
      - EDGE_MGMT_URL=https://192.168.13.1:440
      - SITES_CONFIG={"home":{"name":"Home","wanInterface":"wan","deviceName":"edge","speedtestTarget":1000000000,"thresholds":{"latency":{"green":40,"yellow":80},"loss":{"green":0,"yellow":5},"txRetries":{"green":20,"yellow":35},"speedtest":{"green":900000000,"yellow":700000000}}}}
      # SoT adapter (T070): none | nautobot | netbox
      - SOT_TYPE=none
      - NAUTOBOT_URL=
      - NETBOX_URL=
  - name: unifi-exporter-config
    literals:
      - UNIFI_HOST=https://192.168.100.10:11443
      - SITE_LABEL=home
      - GUEST_ACCESS_TYPES=GUEST,HOTSPOT
  - name: unifi-exporter-script
    files:
      - exporter.py=configs/exporter.py

# Secrets are NOT generated here. Copy secret.example.yaml → secret.yaml,
# fill values, then: kubectl apply -f secret.yaml  (or include in an overlay).
generatorOptions:
  disableNameSuffixHash: true
