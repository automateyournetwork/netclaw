# NetClaw Convergence — Alertmanager (080 Phase 4 K3s)
# Edit url before apply: host alert-receiver webhook (NetClaw agent plane).
# Pilot default host was 192.168.3.252:8099 — replace with your agent IP.
#
# SAFETY: group coarsely; never group by ifIndex. See docs/CONVERGENCE-ALERT-SAFETY.md
route:
  receiver: netclaw
  group_by: ["alertname", "device_name", "instance", "severity"]
  group_wait: 45s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - investigate="false"
      receiver: netclaw
      group_by: ["alertname", "device_name"]
      group_wait: 2m
      group_interval: 30m
      repeat_interval: 12h
      continue: false
    - matchers:
        - severity="info"
      receiver: netclaw
      group_by: ["alertname", "device_name"]
      group_wait: 2m
      group_interval: 30m
      repeat_interval: 12h
      continue: false

receivers:
  - name: netclaw
    webhook_configs:
      - url: "http://192.168.3.252:8099/webhook"
        send_resolved: true
