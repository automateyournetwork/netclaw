# convergence-api — HUD HOME backend (Docker service: convergence-api)
# Build: docker build -t netclaw-convergence-api:local ui/convergence-api
# Load into k3s: docker save netclaw-convergence-api:local | sudo k3s ctr images import -
apiVersion: v1
kind: Service
metadata:
  name: convergence-api
  labels:
    app.kubernetes.io/name: convergence-api
    app.kubernetes.io/part-of: netclaw-convergence
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: convergence-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Optional NodePort for single-host lab access from the NetClaw host / HUD.
# Change type or add Ingress in an overlay for production.
apiVersion: v1
kind: Service
metadata:
  name: convergence-api-node
  labels:
    app.kubernetes.io/name: convergence-api
    app.kubernetes.io/part-of: netclaw-convergence
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: convergence-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convergence-api
  labels:
    app.kubernetes.io/name: convergence-api
    app.kubernetes.io/part-of: netclaw-convergence
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: convergence-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: convergence-api
        app.kubernetes.io/part-of: netclaw-convergence
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: convergence-api
          image: netclaw-convergence-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: convergence-api-config
                  key: PUBLIC_URL
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: home-secrets
                  key: PGDATABASE
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: home-secrets
                  key: PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-secrets
                  key: PGPASSWORD
            - name: PROMETHEUS_URL
              value: http://prometheus:9090
            - name: ALERTMANAGER_URL
              value: http://alertmanager:9093
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: home-secrets
                  key: JWT_SECRET
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: home-secrets
                  key: API_KEYS
            - name: USERS
              valueFrom:
                secretKeyRef:
                  name: home-secrets
                  key: USERS
            - name: SITES_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: convergence-api-config
                  key: SITES_CONFIG
            - name: UNIFI_HOST
              valueFrom:
                configMapKeyRef:
                  name: convergence-api-config
                  key: UNIFI_HOST
                  optional: true
            - name: UNIFI_MGMT_URL
              valueFrom:
                configMapKeyRef:
                  name: convergence-api-config
                  key: UNIFI_MGMT_URL
                  optional: true
            - name: PFSENSE_MGMT_URL
              valueFrom:
                configMapKeyRef:
                  name: convergence-api-config
                  key: PFSENSE_MGMT_URL
                  optional: true
            - name: EDGE_MGMT_URL
              valueFrom:
                configMapKeyRef:
                  name: convergence-api-config
                  key: EDGE_MGMT_URL
                  optional: true
            - name: SOT_TYPE
              valueFrom:
                configMapKeyRef:
                  name: convergence-api-config
                  key: SOT_TYPE
                  optional: true
            - name: NAUTOBOT_URL
              valueFrom:
                configMapKeyRef:
                  name: convergence-api-config
                  key: NAUTOBOT_URL
                  optional: true
            - name: NAUTOBOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: home-secrets
                  key: NAUTOBOT_TOKEN
                  optional: true
            - name: NETBOX_URL
              valueFrom:
                configMapKeyRef:
                  name: convergence-api-config
                  key: NETBOX_URL
                  optional: true
            - name: NETBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: home-secrets
                  key: NETBOX_TOKEN
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
