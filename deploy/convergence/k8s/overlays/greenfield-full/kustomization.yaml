# Greenfield + full stack: base Home stack plus generic-snmp-wireless (T071)
# and the full observability component (T072) — Loki, VictoriaMetrics,
# Grafana, speedtest. Everything in namespace netclaw-convergence.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/generic-snmp-wireless
  - ../../components/full-stack

# Same as overlays/greenfield: apply secrets before this overlay:
#   kubectl apply -f deploy/convergence/k8s/secret.yaml
#   kubectl apply -k deploy/convergence/k8s/overlays/greenfield-full
#
# Then complete the manual Prometheus scrape wiring documented in:
#   ../../components/generic-snmp-wireless/README.md
#   ../../components/full-stack/README.md
