# Rendered by smoke-docker.sh / render-config.sh via envsubst.
# ALERT_RECEIVER_URL — host alert-receiver webhook (default host.docker.internal:8099)
route:
  receiver: netclaw
  # Prefer device_name over raw instance when present; avoid ifIndex in group_by
  # (high-cardinality interface alerts must not each become a separate AM group).
  group_by: ["alertname", "device_name", "instance", "severity"]
  group_wait: 45s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Info / explicitly non-investigate alerts: still notify receiver (metrics/
    # diary) but AM groups them coarsely so they do not fan out by ifIndex.
    - matchers:
        - investigate="false"
      receiver: netclaw
      group_by: ["alertname", "device_name"]
      group_wait: 2m
      group_interval: 30m
      repeat_interval: 12h
      continue: false
    - matchers:
        - severity="info"
      receiver: netclaw
      group_by: ["alertname", "device_name"]
      group_wait: 2m
      group_interval: 30m
      repeat_interval: 12h
      continue: false

receivers:
  - name: netclaw
    webhook_configs:
      - url: "http://host.docker.internal:8099/webhook"
        send_resolved: true
