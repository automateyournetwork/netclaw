# Convergence log ship → Loki (Phase 8/10)
# Profiles: full | device-syslog
#
# 1) Syslog RFC5424 TCP :1601 from syslog-gateway (devices → :1514 RFC3164)
# 2) OpenClaw gateway files (/var/log/openclaw from host /tmp/openclaw)
# 3) Optional flat agent logs (/var/log/netclaw)
# 4) Host journal (user + system) for mesh / members / gateway units

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Device / network syslog — switches, pfSense, etc.
  #
  # Devices send vendor-default RFC3164/BSD to syslog-gateway on :1514; that
  # gateway re-emits RFC5424 with octet-counted framing to this TCP listener.
  # Do NOT point devices straight at this port: promtail's syslog target parses
  # RFC5424 only and silently discards BSD-format streams (spec FR-035 / T141).
  - job_name: device-syslog
    syslog:
      listen_address: 0.0.0.0:1601
      listen_protocol: tcp
      idle_timeout: 120s
      use_incoming_timestamp: true
      label_structured_data: true
      labels:
        job: device-syslog
        site: home
    relabel_configs:
      - source_labels: [__syslog_message_hostname]
        target_label: host
      - source_labels: [__syslog_message_hostname]
        target_label: device_name
      - source_labels: [__syslog_message_app_name]
        target_label: app
      - source_labels: [__syslog_message_severity]
        target_label: level
      # NOTE: __syslog_connection_hostname is the syslog-gateway, not the device
      # (the gateway is the TCP peer), so it is deliberately not labelled here.
      # Device identity comes from __syslog_message_hostname, which syslog-ng
      # preserves (keep-hostname) or fills with the sending IP.

  # OpenClaw gateway file logs (host /tmp/openclaw → container /var/log/openclaw)
  - job_name: openclaw-gateway
    static_configs:
      - targets: [localhost]
        labels:
          job: openclaw-gateway
          service: openclaw
          site: home
          __path__: /var/log/openclaw/*.log

  # Optional agent flat logs
  - job_name: netclaw-agent
    static_configs:
      - targets: [localhost]
        labels:
          job: netclaw-agent
          site: home
          __path__: /var/log/netclaw/*.log

  # systemd journal — mesh, members, gateway (user units under user@UID)
  - job_name: netclaw-journal
    journal:
      path: /var/log/journal
      # 7d, not 24h: mesh/member units are event-driven and can sit quiet for a
      # day, which made the NetClaw board's N2N panel look broken (and invited a
      # message-regex workaround) when the units were simply idle. The unit keep
      # list below bounds the volume, and the positions file stops re-shipping.
      max_age: 168h
      labels:
        job: netclaw-journal
        site: home
    relabel_configs:
      # Prefer user unit (mesh/members/gateway); fall back to system unit
      - source_labels: ["__journal__systemd_unit"]
        target_label: unit
      - source_labels: ["__journal__systemd_user_unit"]
        regex: "(.+)"
        target_label: unit
      # Keep only NetClaw / OpenClaw related units
      - source_labels: ["unit"]
        regex: "(netclaw-mesh\\.service|netclaw-member-.*\\.service|openclaw-gateway\\.service|netclaw-hud\\.service|openclaw-token-exporter\\.service)"
        action: keep
      - source_labels: ["unit"]
        regex: "netclaw-mesh\\.service"
        target_label: job
        replacement: netclaw-mesh
      - source_labels: ["unit"]
        regex: "netclaw-member-.*\\.service"
        target_label: job
        replacement: netclaw-member
      - source_labels: ["unit"]
        regex: "openclaw-gateway\\.service"
        target_label: job
        replacement: openclaw-gateway
      - source_labels: ["unit"]
        regex: "netclaw-hud\\.service"
        target_label: job
        replacement: netclaw-hud
      - source_labels: ["__journal_priority_keyword"]
        target_label: level
