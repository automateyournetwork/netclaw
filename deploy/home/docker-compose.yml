# NetClaw Home — Docker minimal stack (067-home-noc Phase 3)
#
# Core: postgres, prometheus, alertmanager, blackbox, home-api
# Optional: unifi-exporter  →  docker compose --profile unifi up -d
#
# From repo root:
#   cp deploy/home/.env.example deploy/home/.env   # edit secrets
#   ./deploy/home/render-config.sh                 # alertmanager webhook
#   docker compose -f deploy/home/docker-compose.yml --env-file deploy/home/.env up -d --build
#   ./deploy/home/smoke-docker.sh
#
# Point HUD:
#   HOME_API_URL=http://127.0.0.1:3080
#   HOME_API_TOKEN=<same as API key in .env>

name: netclaw-home

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-home}
      POSTGRES_USER: ${PGUSER:-home}
      POSTGRES_PASSWORD: ${PGPASSWORD:-home_dev_change_me}
    volumes:
      - home-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-home} -d ${PGDATABASE:-home}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [home]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - home-promdata:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks: [home]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - home-amdata:/alertmanager
    ports:
      - "${ALERTMANAGER_HOST_PORT:-9093}:9093"
    extra_hosts:
      # Reach NetClaw host alert-receiver (T031)
      - "host.docker.internal:host-gateway"
    networks: [home]

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "${BLACKBOX_HOST_PORT:-9115}:9115"
    networks: [home]

  home-api:
    build:
      context: ../../ui/home-api
      dockerfile: Dockerfile
    image: netclaw-home-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      alertmanager:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:3080}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-home}
      PGUSER: ${PGUSER:-home}
      PGPASSWORD: ${PGPASSWORD:-home_dev_change_me}
      PROMETHEUS_URL: http://prometheus:9090
      ALERTMANAGER_URL: http://alertmanager:9093
      JWT_SECRET: ${JWT_SECRET:-change-me-home-api-jwt}
      API_KEYS: ${API_KEYS}
      USERS: ${USERS:-[]}
      SITES_CONFIG: ${SITES_CONFIG}
      # Device name → management GUI deep-links (HOME Devices / Wi‑Fi)
      UNIFI_HOST: ${UNIFI_HOST:-}
      UNIFI_MGMT_URL: ${UNIFI_MGMT_URL:-${UNIFI_HOST:-}}
      PFSENSE_MGMT_URL: ${PFSENSE_MGMT_URL:-https://192.168.13.1:440}
      EDGE_MGMT_URL: ${EDGE_MGMT_URL:-${PFSENSE_MGMT_URL:-}}
    ports:
      - "${HOME_API_HOST_PORT:-3080}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [home]

  # Optional UniFi Integration API exporter (profile: unifi)
  unifi-exporter:
    profiles: ["unifi"]
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "/app/exporter.py"]
    environment:
      UNIFI_HOST: ${UNIFI_HOST:-https://192.168.1.1}
      UNIFI_API_KEY: ${UNIFI_API_KEY:-}
      SITE_LABEL: ${SITE_LABEL:-home}
      LISTEN_PORT: "9899"
      GUEST_ACCESS_TYPES: ${GUEST_ACCESS_TYPES:-GUEST,HOTSPOT}
    volumes:
      - ./adapters/unifi/exporter.py:/app/exporter.py:ro
    ports:
      - "${UNIFI_EXPORTER_HOST_PORT:-9899}:9899"
    networks: [home]

networks:
  home:
    name: netclaw-home

volumes:
  home-pgdata:
  home-promdata:
  home-amdata:
